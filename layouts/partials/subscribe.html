<section class="subscribe-box" aria-labelledby="subscribe-heading">
	<h3 id="subscribe-heading">Get new posts by email</h3>
	<p>No spam, just the occasional post. Unsubscribe anytime.</p>
	<form class="subscribe-form" novalidate>
		<input type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required />
		<button type="submit">Subscribe</button>
	</form>
	<p class="subscribe-status" role="status" aria-live="polite"></p>
</section>
