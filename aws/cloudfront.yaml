AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  pS3BucketName:
    Type: String
    Default: clayton-blog-app
  pACMCertArn:
    Type: String
    Default: arn:aws:acm:us-east-1:210557127338:certificate/f2397e58-2489-45fe-a970-91ffe1112f9b
Resources:
## Create Cloudfront origin buckets and policies
  rS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref pS3BucketName
  rBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties: 
      Bucket:
        Ref: rS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt rCloudfrontOriginAccessIdentity.S3CanonicalUserId
            Action: "s3:GetObject"
            Resource: !Sub "${rS3Bucket.Arn}/*"
  rCloudfrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: string-value
  ## The S3 origin has no directory index, so /post/slug/ and /post/slug would otherwise
  ## fall through to the home page. Rewrite them to the page's index.html.
  rIndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve /path/ and /path as /path/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSegment = uri.split('/').pop();
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (lastSegment.indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }
  ## Cloudfront distribution
  rCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !Join [".", [!Ref rS3Bucket, "s3.amazonaws.com"] ]
            Id: blog-app
            # CustomOriginConfig:
            #   OriginProtocolPolicy: http-only
            S3OriginConfig:
              OriginAccessIdentity: !Join ["", ["origin-access-identity/cloudfront/", !Ref rCloudfrontOriginAccessIdentity] ]
        Enabled: 'true'
        CustomErrorResponses:
          - ErrorCachingMinTTL: 300
            ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: "/index.html"
          - ErrorCachingMinTTL: 300
            ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: "/index.html"
        Comment: Cloudfront distribution for blog app
        DefaultRootObject: index.html
        # Logging:
        #   IncludeCookies: 'false'
        #   Bucket: workerscan-cloudfront-logging-bucket.s3.amazonaws.com
        #   Prefix: workerscan
        Aliases:
          - blog.claytondavis.dev
        DefaultCacheBehavior:
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          TargetOriginId: blog-app
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt rIndexRewriteFunction.FunctionMetadata.FunctionARN
          ForwardedValues:
            QueryString: 'true'
          ViewerProtocolPolicy: redirect-to-https
          # ViewerProtocolPolicy: allow-all
        PriceClass: PriceClass_100
        Restrictions:
          GeoRestriction:
            RestrictionType: blacklist
            Locations:
            - RU # Russia
            - IS # Iceland
        ViewerCertificate:
          AcmCertificateArn: !Ref pACMCertArn
          # CloudFrontDefaultCertificate: true
          ## Modern Browsers
          SslSupportMethod: sni-only
          ## All browsers - additional charge
          # SslSupportMethod: vip
Outputs:
  CloudfrontDistributionId:
    Value: !Ref rCloudfrontDistribution
  Bucket:
    Value: !Ref rS3Bucket